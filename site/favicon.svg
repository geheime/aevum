<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="aevum">
  <rect width="64" height="64" rx="13" fill="#0A0C10"/>
  <g fill="#ECE6D6">
    <!-- cornisa -->
    <rect x="9" y="10" width="46" height="3.2"/>
    <!-- friso de discos (Knossos) -->
    <circle cx="18" cy="17.2" r="1.7"/><circle cx="28" cy="17.2" r="1.7"/><circle cx="38" cy="17.2" r="1.7"/><circle cx="48" cy="17.2" r="1.7"/>
    <!-- arquitrabe -->
    <rect x="11" y="21.4" width="42" height="3"/>
    <!-- capiteles cushion (almohadón); la banda oscura = gap hasta el fuste -->
    <ellipse cx="18" cy="27" rx="3.8" ry="1.8"/><ellipse cx="28" cy="27" rx="3.8" ry="1.8"/><ellipse cx="38" cy="27" rx="3.8" ry="1.8"/><ellipse cx="48" cy="27" rx="3.8" ry="1.8"/>
    <!-- columnas atectónicas: más anchas arriba, angostas abajo (minoicas) -->
    <polygon points="15.6,30 20.4,30 19.6,46 16.4,46"/><polygon points="25.6,30 30.4,30 29.6,46 26.4,46"/>
    <polygon points="35.6,30 40.4,30 39.6,46 36.4,46"/><polygon points="45.6,30 50.4,30 49.6,46 46.4,46"/>
    <!-- crepidoma (escalones) -->
    <rect x="12" y="47" width="40" height="2.8"/>
    <rect x="8" y="50.4" width="48" height="3.4"/>
  </g>
</svg>
