<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="aevum">
  <rect width="64" height="64" rx="13" fill="#0A0C10"/>
  <g fill="#ECE6D6">
    <!-- dintel plano minoico (bold) -->
    <rect x="8" y="13" width="48" height="6"/>
    <!-- capiteles cushion (bloque más ancho que el fuste) -->
    <rect x="12" y="22" width="12" height="3.4"/>
    <rect x="26" y="22" width="12" height="3.4"/>
    <rect x="40" y="22" width="12" height="3.4"/>
    <!-- columnas atectónicas: anchas arriba, angostas abajo -->
    <polygon points="14,27 22,27 20.6,46 15.4,46"/>
    <polygon points="28,27 36,27 34.6,46 29.4,46"/>
    <polygon points="42,27 50,27 48.6,46 43.4,46"/>
    <!-- crepidoma (base bold) -->
    <rect x="9" y="47" width="46" height="6"/>
  </g>
</svg>
