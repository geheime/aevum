<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aevum — pillar in motion</title>
<style>
  :root{ --void:#0A0C10; --ink:#ECE6D6; --silver:#9FB2C6; --steel:#4C6076; --dim:#6F7C8A;
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--void)}
  body{color:var(--ink);font-family:var(--mono);overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%}
  .plate{position:fixed;left:0;right:0;bottom:8.5%;text-align:center;pointer-events:none}
  .word{font-size:clamp(30px,6vw,54px);letter-spacing:.44em;padding-left:.44em;color:var(--ink);font-weight:500}
  .tag{margin-top:16px;font-size:clamp(9px,1.5vw,12px);letter-spacing:.36em;text-transform:uppercase;color:var(--dim)}
  .corner{position:fixed;top:18px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--steel)}
  .corner.l{left:20px} .corner.r{right:20px;color:var(--dim)}
</style>
</head>
<body>
<div class="corner l">aevum</div>
<div class="corner r">begins, never ends.</div>
<canvas id="c"></canvas>
<div class="plate"><div class="word">aevum</div><div class="tag">The instance is mortal · The project is not</div></div>
<script>
(() => {
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  const INK=[236,230,214],SIL=[159,178,198],STE=[76,96,118];
  const GLY=['·','.',':','+','=','*','×','#'];
  const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  const lerp=(a,b,k)=>a+(b-a)*Math.max(0,Math.min(1,k)), clamp=v=>Math.max(0,Math.min(1,v));
  const hash=(x,y)=>{let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);};
  function mix(l){let a,b,k;l=clamp(l);if(l<0.5){a=STE;b=SIL;k=l/0.5;}else{a=SIL;b=INK;k=(l-0.5)/0.5;}
    return `rgb(${a[0]+(b[0]-a[0])*k|0},${a[1]+(b[1]-a[1])*k|0},${a[2]+(b[2]-a[2])*k|0})`;}
  function hw(t){
    if(t<0)return 0;if(t>1)return 0;
    if(t<0.045)return 1.00;                                   // ábaco
    if(t<0.11) return lerp(0.90,0.70,(t-0.045)/0.065);        // equino
    if(t<0.15) return lerp(0.70,0.58,(t-0.11)/0.04);          // collarín
    if(t<0.88){const k=(t-0.15)/0.73;return lerp(0.58,0.40,k)+Math.sin(k*Math.PI)*0.02;} // fuste (taper minoico)
    return lerp(0.40,0.52,(t-0.88)/0.12);                     // base
  }
  let W,H,dpr,cell,cols,rows,padTop,pillH,maxHW,cx,stylY,FRAME=null;
  function layout(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    cell=Math.max(5,Math.round(Math.min(W,H)/108));
    cols=Math.ceil(W/cell);rows=Math.ceil(H/cell);
    padTop=H*0.085; const padBot=H*0.30; pillH=H-padTop-padBot;
    maxHW=Math.min(W*0.20, pillH*0.235); cx=W/2; stylY=padTop+pillH; // línea de estilóbato
    if(FRAME!==null){ draw(FRAME); document.title='ready'; }   // modo captura: redibuja el frame tras cada relayout
  }
  // fase T en [0,1) — periódica para loopear sin salto
  function draw(T){
    ctx.clearRect(0,0,W,H);
    ctx.textAlign='center';ctx.textBaseline='middle';
    const twoPi=Math.PI*2;
    // estilóbato: fina línea de apoyo que ancla la base
    for(let gx=Math.floor((cx-maxHW*1.5)/cell);gx<Math.ceil((cx+maxHW*1.5)/cell);gx++){
      const px=gx*cell+cell/2, d=Math.abs(px-cx), edge=1-clamp((d-maxHW*0.7)/(maxHW*0.8));
      if(edge<=0.02)continue; ctx.globalAlpha=0.5*edge; ctx.fillStyle=mix(0.5);
      ctx.fillRect(px-cell*0.42, stylY+cell*0.3, cell*0.84, cell*0.5);
    }
    for(let gy=0;gy<rows;gy++){
      for(let gx=0;gx<cols;gx++){
        const px=gx*cell+cell/2, py=gy*cell+cell/2;
        const t=(py-padTop)/pillH; const hwt=hw(t)*maxHW; const dx=Math.abs(px-cx);
        let lum=0, isEdge=false;
        if(hwt>0 && dx<=hwt){
          const round=1-Math.pow(dx/hwt,1.7), vert=1-t*0.24, left=px<cx?1.05:0.9;
          const flute=(t>0.15&&t<0.88)?(0.93+0.07*Math.cos(dx/hwt*Math.PI*3.0)):1;
          lum=clamp((0.44+0.58*round)*vert*left*flute);
          const ef=(hwt-dx)/hwt; if(ef<0.12){lum*=ef/0.12; if(ef>0.03)isEdge=true;}
        } else if(hwt>0 && dx<=hwt+cell*1.6){
          // polvo del borde — respira con la fase (materia efímera que orbita la estructura)
          const orb=0.5+0.5*Math.sin(twoPi*T + hash(gx,gy)*twoPi + gy*0.25);
          if(hash(gx*1.7,gy*1.3) < 0.09*orb) lum=hash(gy,gx)*0.26*orb;
        }
        if(lum<=0.05) continue;
        const seed=hash(gx,gy);
        // titileo periódico: la estructura queda, el brillo respira
        const flick=0.84+0.16*Math.sin(twoPi*T + seed*twoPi + gx*0.2 + gy*0.15);
        let L=lum*flick;
        const bay=BAYER[gy&3][gx&3]/16;
        if(L < bay*0.5 && !isEdge) continue;                  // dither ordenado
        if(isEdge) L=Math.max(L,0.55);                        // el contorno se sostiene (el plano permanente)
        const col=mix(L);
        // caracteres que cambian con la fase (los signos mutan, el pilar no)
        if(!isEdge && hash(gx*1.3,gy*0.7)<0.11 && L>0.24){
          const gi=(Math.floor(T*8 + seed*8)) % GLY.length;
          ctx.globalAlpha=Math.min(1,L*0.92); ctx.fillStyle=col;
          ctx.font=`${Math.round(cell*1.5)}px ${'ui-monospace,Menlo,monospace'}`;
          ctx.fillText(GLY[gi],px,py);
        } else {
          const s=cell*(isEdge?0.62:(0.44+0.5*L));
          ctx.globalAlpha=Math.min(1,L*1.05); ctx.fillStyle=col;
          ctx.fillRect(px-s/2,py-s/2,s,s);
        }
      }
    }
    ctx.globalAlpha=1;
  }
  // Si viene ?t= (captura de frames) dibuja fijo; si no, anima en vivo.
  const q=new URLSearchParams(location.search);
  FRAME = q.has('t') ? ((( parseFloat(q.get('t'))%1 )+1)%1) : null;
  layout(); window.addEventListener('resize',layout);
  if(FRAME===null){ const T0=performance.now(); (function loop(now){ draw(((now-T0)/6000)%1); requestAnimationFrame(loop); })(T0); }
})();
</script>
</body>
</html>
