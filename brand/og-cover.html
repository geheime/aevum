<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aevum — og cover</title>
<style>
  /* og-cover.html — dedicated 1200×630 social card. Reuses the Knossos temple
     motor (lumAt) from site/index.html verbatim, with a layout tuned for the
     card frame. Screenshot at deviceScaleFactor 2 → 2400×1260 (retina og). */
  :root{ --void:#0A0C10; --ink:#ECE6D6; --silver:#9FB2C6; --steel:#4C6076; --dim:#6F7C8A;
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--mono)}
  #frame{position:relative;width:1200px;height:630px}
  #stars,#glyph{position:absolute;inset:0;width:1200px;height:630px}
  #stars{z-index:0} #glyph{z-index:1}
  .text{position:absolute;left:0;right:0;z-index:2;text-align:center}
  .word{top:404px;font-size:66px;letter-spacing:.46em;padding-left:.46em;font-weight:500;color:var(--ink)}
  .tag{top:498px;font-size:14px;letter-spacing:.30em;text-transform:uppercase;color:var(--dim)}
  .tag .s{color:var(--steel);margin:0 .5em}
  .url{top:570px;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--steel)}
</style>
</head>
<body>
<div id="frame">
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="glyph" aria-hidden="true"></canvas>
  <div class="text word">aevum</div>
  <div class="text tag">The instance is mortal<span class="s">·</span>the project is not</div>
  <div class="text url">aevum-os.pages.dev</div>
</div>

<script>
/* faint far-background starfield — depth, very subtle (static frame) */
(() => {
  const cv=document.getElementById('stars'),ctx=cv.getContext('2d');
  const COLS=[[159,178,198],[76,96,118],[111,124,138]];
  const dpr=2, W=1200, H=630;   // supersample 2x → crisp downscale in the screenshot
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.round(W*H/15000);
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<n;i++){const d=Math.random();
    const a=(0.04+d*0.12)*(0.5+0.5*Math.random());
    ctx.globalAlpha=a;ctx.fillStyle=`rgb(${(COLS[(Math.random()*COLS.length)|0]).join(',')})`;
    ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H,0.5+d*1.3,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
})();
</script>

<script>
/* Knossos temple — lumAt() copied verbatim from site/index.html (ROOF='flat'),
   with a card-tuned layout M. Drawn once, static. */
(() => {
  const cv=document.getElementById('glyph'), ctx=cv.getContext('2d');
  const ROOF='flat';
  const INK=[236,230,214],SIL=[159,178,198],STE=[76,96,118];
  const GLY=['·','.',':','+','=','*','×','#'];
  const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  const lerp=(a,b,k)=>a+(b-a)*Math.max(0,Math.min(1,k)), clamp=v=>Math.max(0,Math.min(1,v));
  const hash=(x,y)=>{let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);};
  function mix(l){let a,b,k;l=clamp(l);if(l<0.5){a=STE;b=SIL;k=l/0.5;}else{a=SIL;b=INK;k=(l-0.5)/0.5;}
    return `rgb(${a[0]+(b[0]-a[0])*k|0},${a[1]+(b[1]-a[1])*k|0},${a[2]+(b[2]-a[2])*k|0})`;}
  function hw(t){
    if(t<0)return 0;if(t>1)return 0;
    if(t<0.06)return 1.00;
    if(t<0.13)return lerp(0.94,0.80,(t-0.06)/0.07);
    if(t<0.17)return lerp(0.80,0.72,(t-0.13)/0.04);
    if(t<0.90){const k=(t-0.17)/0.73;return lerp(0.72,0.54,k)+Math.sin(k*Math.PI)*0.014;}
    return lerp(0.54,0.60,(t-0.90)/0.10);
  }
  const dpr=2, W=1200, H=630;   // supersample 2x → crisp downscale in the screenshot
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cell=4;
  // card-tuned layout: temple centered, commanding the upper ~60% of the frame,
  // its base clearing the wordmark below.
  const Wm=540, Hm=Wm*0.62, top=44;
  const M={cx:W/2, top, Hm, Wm};
  function lumAt(px,py){
    const {cx,top,Hm,Wm}=M,n=4;
    const colAreaW=Wm*0.80,pitch=colAreaW/n,colHW=Math.min(pitch*0.32,Hm*0.072),c0=cx-colAreaW/2;
    const cen=[];for(let i=0;i<n;i++)cen.push(c0+pitch*(i+0.5));
    const colSpreadHalf=(cen[n-1]-cen[0])/2+colHW,cornHalf=colSpreadHalf+pitch*0.32;
    const d=Math.abs(px-cx);let lum=0,entBot;
    if(ROOF==='pediment'){
      const pedTop=top,pedH=Hm*0.20,pedBot=pedTop+pedH,entTop=pedBot,entH=Hm*0.095;entBot=entTop+entH;
      if(py>=pedTop&&py<pedBot){const s=cornHalf*(py-pedTop)/pedH;if(d<=s){lum=0.30;if(s-d<colHW*0.5)lum=0.60;}}
      if(py>=entTop&&py<entBot&&d<=cornHalf){let e=Math.min(1,((cornHalf-d)/cornHalf)/0.05);lum=Math.max(lum,0.56*(px<cx?1.03:0.93)*e);const ty=(py-entTop)/entH;if(ty<0.14||ty>0.86)lum=Math.max(lum,0.66*e);}
    } else {   // Knossos: cornisa con buñas + friso de discos + arquitrabe
      const corniceTop=top,corniceH=Hm*0.044,corniceBot=corniceTop+corniceH;
      const friezeTop=corniceBot+Hm*0.006,friezeH=Hm*0.072,friezeBot=friezeTop+friezeH;
      const archTop=friezeBot+Hm*0.006,archH=Hm*0.040;entBot=archTop+archH;
      if(py>=corniceTop&&py<corniceBot){const cw=cornHalf*1.04;if(d<=cw){const ty=(py-corniceTop)/corniceH;
        if(!(Math.abs(ty-0.58)<0.12)){let e=Math.min(1,((cw-d)/cw)/0.05);let cl=0.54*e;if(ty<0.16||ty>0.9)cl=Math.max(cl,0.68*e);lum=Math.max(lum,cl*(px<cx?1.02:0.95));}}}   // buña ~0.58
      if(py>=friezeTop&&py<friezeBot&&d<=cornHalf*0.98){const midY=(friezeTop+friezeBot)/2,discR=Hm*0.036,pitchD=Hm*0.086;
        const idx=Math.round((px-cx)/pitchD),xc=cx+idx*pitchD,dd=Math.hypot(px-xc,py-midY);
        if(dd<=discR){const cl=0.72*(1-0.18*Math.pow(dd/discR,2));lum=Math.max(lum,cl);}}   // friso de discos fino (gaps en void)
      if(py>=archTop&&py<entBot&&d<=cornHalf){let e=Math.min(1,((cornHalf-d)/cornHalf)/0.05);lum=Math.max(lum,0.56*(px<cx?1.03:0.93)*e);if((py-archTop)/archH<0.22)lum=Math.max(lum,0.66*e);}
    }
    // capitel cushion (almohadón) + banda oscura + fuste
    const capTop=entBot+Hm*0.004, capH=Hm*0.085, capBot=capTop+capH;
    const capW=colHW*1.55, abH=capH*0.22, cuH=capH*0.46, abBot=capTop+abH, cuBot=abBot+cuH;
    const colTop=capBot, colBot=top+Hm*0.86, crepTop=colBot,crepH=Hm*0.14,crepBot=crepTop+crepH;
    if(py>=capTop&&py<colBot){
      for(let i=0;i<n;i++){const dx=Math.abs(px-cen[i]);
        if(py<capBot){
          if(py<abBot){ if(dx<=capW*0.96){let cl=0.60*(px<cen[i]?1.04:0.92);const ef=(capW*0.96-dx)/(capW*0.96);if(ef<0.14)cl*=ef/0.14;lum=Math.max(lum,cl);} }        // ábaco
          else if(py<cuBot){ const ty=(py-abBot)/cuH,hwcap=capW*(0.60+0.40*Math.sin(ty*Math.PI));                                                                          // cushion
            if(dx<=hwcap){const round=1-Math.pow(dx/hwcap,1.8),left=px<cen[i]?1.06:0.9;let cl=clamp((0.46+0.56*round)*left);const ef=(hwcap-dx)/hwcap;if(ef<0.12)cl*=ef/0.12;lum=Math.max(lum,cl);} }
          // banda oscura [cuBot,capBot): no se dibuja → celdas apagadas = la banda negra en negativo
        } else { const t=(py-colTop)/(colBot-colTop),hwt=hw(t)*colHW;                                                                                                       // fuste
          if(dx<=hwt){const round=1-Math.pow(dx/hwt,1.7),vert=1-t*0.24,left=px<cen[i]?1.05:0.9,flute=(t>0.17&&t<0.90)?(0.93+0.07*Math.cos(dx/hwt*Math.PI*3.0)):1;let cl=clamp((0.44+0.58*round)*vert*left*flute);const ef=(hwt-dx)/hwt;if(ef<0.12)cl*=ef/0.12;lum=Math.max(lum,cl);} }
      }
    }
    if(py>=crepTop&&py<crepBot){const s2=Math.floor((py-crepTop)/(crepH/3)),bh=cornHalf*(0.98+s2*0.055);if(d<=bh){let e=Math.min(1,((bh-d)/bh)/0.04);lum=Math.max(lum,0.5*e*(px<cx?1.02:0.94));}}
    return lum;
  }
  function draw(T){
    ctx.clearRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';
    const twoPi=Math.PI*2;
    const gx0=Math.floor((M.cx-M.Wm/2-cell*2)/cell),gx1=Math.ceil((M.cx+M.Wm/2+cell*2)/cell);
    const gy0=Math.floor((M.top-cell)/cell),gy1=Math.ceil((M.top+M.Hm+cell)/cell);
    for(let gy=gy0;gy<gy1;gy++)for(let gx=gx0;gx<gx1;gx++){
      const px=gx*cell+cell/2,py=gy*cell+cell/2;let lum=lumAt(px,py),isEdge=false;
      if(lum>0.14){if(Math.min(lumAt(px+cell,py),lumAt(px-cell,py),lumAt(px,py+cell),lumAt(px,py-cell))<0.10)isEdge=true;}
      if(lum<=0.05){if(lum<0.005){const near=lumAt(px+cell,py)+lumAt(px-cell,py)+lumAt(px,py+cell)+lumAt(px,py-cell);if(near>0.15){const orb=0.5+0.5*Math.sin(twoPi*T+hash(gx,gy)*twoPi);if(hash(gx*1.7,gy*1.3)<0.10*orb)lum=hash(gy,gx)*0.24*orb;}}if(lum<=0.05)continue;}
      const seed=hash(gx,gy),flick=0.84+0.16*Math.sin(twoPi*T+seed*twoPi+gx*0.18+gy*0.14);let L=lum*flick;
      const bay=BAYER[gy&3][gx&3]/16;if(L<bay*0.5&&!isEdge)continue;if(isEdge)L=Math.max(L,0.55);
      const col=mix(L);
      if(!isEdge&&hash(gx*1.3,gy*0.7)<0.11&&L>0.24){const gi=(Math.floor(T*8+seed*8))%GLY.length;ctx.globalAlpha=Math.min(1,L*0.92);ctx.fillStyle=col;ctx.font=`${Math.round(cell*1.5)}px ui-monospace,Menlo,monospace`;ctx.fillText(GLY[gi],px,py);}
      else{const s=cell*(isEdge?0.6:(0.44+0.5*L));ctx.globalAlpha=Math.min(1,L*1.05);ctx.fillStyle=col;ctx.fillRect(px-s/2,py-s/2,s,s);}
    }
    ctx.globalAlpha=1;
  }
  draw(0.32);
  window.__ogReady=true;
})();
</script>
</body>
</html>
